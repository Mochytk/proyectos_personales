name: Habit tracker CI

on:
  pull_request:
    paths:
      - 'App_Habit_Tracker/**'
      - '.github/workflows/habit-tracker-ci.yml'
  push:
    branches: [app/habit_tracker]
    paths:
      - 'App_Habit_Tracker/**'
      - '.github/workflows/habit-tracker-ci.yml'

permissions:
  contents: read

concurrency:
  group: habit-tracker-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: App_Habit_Tracker

jobs:
  checks:
    name: Format, lint, types, tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # A throwaway server for the API's integration tests; never a real environment.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        # Pinned by digest; the tag names the release.
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: App_Habit_Tracker/.nvmrc
          package-manager-cache: false

      # pnpm comes from corepack (bundled with Node 24), pinned by packageManager.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tz
      - run: pnpm audit

  e2e:
    name: End-to-end tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: App_Habit_Tracker/.nvmrc
          package-manager-cache: false

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The Chromium build that matches the pinned @playwright/test, plus its system libraries.
      - run: pnpm --filter @habit-tracker/web exec playwright install --with-deps chromium
      - run: pnpm --filter @habit-tracker/web e2e

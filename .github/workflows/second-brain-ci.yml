name: Second brain CI

on:
  pull_request:
    paths:
      - 'App_Second_Brain/**'
      - '.github/workflows/second-brain-ci.yml'
  push:
    branches: [app/second_brain]
    paths:
      - 'App_Second_Brain/**'
      - '.github/workflows/second-brain-ci.yml'

permissions:
  contents: read

concurrency:
  group: second-brain-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: App_Second_Brain

jobs:
  checks:
    name: Format, lint, types, tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      # Actions pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: App_Second_Brain/.nvmrc
          package-manager-cache: false

      # pnpm comes from corepack (bundled with Node 24), pinned by packageManager.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Plain download instead of a third-party action: pinned version, verified checksum.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # The repo is public: scan every commit of every app, not just this PR.
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
